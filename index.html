<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>港鐵實時月台電子看板</title>
    <style>
        * { box-sizing: border-box; }
        body { background: #000; color: #ff9500; font-family: "Courier New", monospace, "Microsoft JhengHei", sans-serif; margin: 0; padding: 15px; }
        .header { text-align: center; font-size: 22px; font-weight: bold; padding: 15px 0; color: #ffd700; border-bottom: 2px solid #222; text-shadow: 0 0 10px #ffd700; margin-bottom: 15px; }

        #status-bar-wrapper {
            overflow: hidden;
            white-space: nowrap;
            padding: 0;
            margin: 0 0 15px 0;
            border-radius: 8px;
            position: relative;
            background: #000;
            border: 2px solid #4cd964;
            box-shadow: inset 0 0 8px rgba(76,217,100,0.3), 0 0 10px rgba(76,217,100,0.2);
            height: 50px;
            display: flex;
            align-items: center;
        }
        #status-bar {
            display: inline-block;
            padding: 0 0;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            width: 100%;
            background: transparent;
            color: #4cd964;
            text-shadow: 0 0 6px #4cd964;
            border-radius: 8px;
            white-space: nowrap;
            position: relative;
            left: 0;
            transition: none;
        }
        @keyframes marquee-scroll {
            0% { margin-left: 100%; }
            100% { margin-left: -100%; }
        }
        .scroll-active {
            animation: marquee-scroll 20s linear infinite;
            width: auto !important;
        }

        #alert-bar { background: #000; color: #ff3b30; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; margin: 15px 0; border: 2px solid #ff3b30; display: none; overflow: hidden; white-space: nowrap; }
        #alert-bar .marquee { display: inline-block; padding-left: 100%; animation: marquee 20s linear infinite; }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
        .picker { background: #111; border-radius: 8px; padding: 15px; margin: 15px 0; display: flex; gap: 10px; border: 1px solid #222; }
        .picker select { flex: 1; padding: 12px; background: #000; color: #ffd700; border: 1px solid #ff9500; border-radius: 6px; font-size: 16px; font-weight: bold; }
        .panel { background: #000; border-radius: 12px; padding: 25px; border: 3px solid #2c2c2e; min-height: 180px; }
        .panel-title { color: #ffd700; font-size: 18px; font-weight: bold; margin-bottom: 20px; border-bottom: 2px solid #ff9500; padding-bottom: 8px; text-shadow: 0 0 8px #ffd700; }
        .train-card { display: flex; justify-content: space-between; align-items: center; padding: 18px 0; border-bottom: 1px dashed #222; }
        .train-card:last-child { border-bottom: none; }
        .train-dest { font-size: 22px; font-weight: bold; color: #ff9500; text-shadow: 0 0 8px #ff9500; }
        .train-plat { font-size: 13px; color: #8e8e93; margin-top: 5px; }
        .train-time { color: #ff9500; font-size: 26px; font-weight: bold; text-shadow: 0 0 8px #ff9500; font-family: monospace; }
        .arriving { color: #4cd964 !important; text-shadow: 0 0 8px #4cd964 !important; animation: blink 0.8s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.1; } }
        .loading-text { text-align: center; color: #333; padding: 40px 0; font-size: 16px; }
    </style>
</head>
<body>

    <div class="header">🚇 MTR 月台實時電子看板</div>

    <div id="status-bar-wrapper">
        <div id="status-bar">✅ 全線車務運作正常</div>
    </div>

    <div id="alert-bar"><span id="alert-text" class="marquee">⚠️ 特別通告</span></div>

    <div class="picker">
        <select id="line-select" onchange="onLineChange()">
            <option value="">--請選擇路綫--</option>
        </select>
        <select id="station-select" onchange="onStationChange()">
            <option value="">--請選擇車站--</option>
        </select>
    </div>

    <div class="panel">
        <div id="panel-title" class="panel-title">PIDS 看板待機中</div>
        <div id="panel-content"><div class="loading-text">請在上方選單選擇路綫...</div></div>
    </div>

    <script>
        const LINES = {
            "TWL": { name: "荃灣綫 Tsuen Wan Line", stations: {"TSW":"荃灣 Tsuen Wan","TWH":"大窩口 Tai Wo Hau","KWH":"葵興 Kwai Hing","KWF":"葵芳 Kwai Fong","LAK":"荔景 Lai King","MEF":"美孚 Mei Foo","LCK":"荔枝角 Lai Chi Kok","CSW":"長沙灣 Cheung Sha Wan","SSP":"深水埗 Sham Shui Po","PRE":"太子 Prince Edward","MOK":"旺角 Mong Kok","YMT":"油麻地 Yau Ma Tei","JOR":"佐敦 Jordan","TST":"尖沙咀 Tsim Sha Tsui","ADM":"金鐘 Admiralty","CEN":"中環 Central"} },
            "KTL": { name: "觀塘綫 Kwun Tong Line", stations: {"TIK":"調景嶺 Tiu Keng Leng","YAT":"油塘 Yau Tong","LAT":"藍田 Lam Tin","KWT":"觀塘 Kwun Tong","NTK":"牛頭角 Ngau Tau Kok","KOB":"九龍灣 Kowloon Bay","CHH":"彩虹 Choi Hung","DIH":"鑽石山 Diamond Hill","WTS":"黃大仙 Wong Tai Sin","LOF":"樂富 Lok Fu","KOT":"九龍塘 Kowloon Tong","SKM":"石硤尾 Shek Kip Mei","PRE":"太子 Prince Edward","MOK":"旺角 Mong Kok","YMT":"油麻地 Yau Ma Tei","HOM":"何文田 Ho Man Tin","WHA":"黃埔 Whampoa"} },
            "ISL": { name: "港島綫 Island Line", stations: {"CHW":"柴灣 Chai Wan","HFC":"杏花邨 Heng Fa Chuen","SKW":"筲箕灣 Shau Kei Wan","SWH":"西灣河 Sai Wan Ho","TAK":"太古 Tai Koo","QUB":"鰂魚涌 Quarry Bay","NOP":"北角 North Point","FOH":"炮台山 Fortress Hill","TIH":"天后 Tin Hau","CWB":"銅鑼灣 Causeway Bay","WAC":"灣仔 Wan Chai","ADM":"金鐘 Admiralty","CEN":"中環 Central","SHW":"上環 Sheung Wan","SYP":"西營盤 Sai Ying Pun","HKU":"香港大學 HKU","KET":"堅尼地城 Kennedy Town"} },
            "TKL": { name: "將軍澳綫 Tseung Kwan O Line", stations: {"POA":"寶琳 Po Lam","LHP":"康城 LOHAS Park","HAH":"坑口 Hang Hau","TKO":"將軍澳 Tseung Kwan O","TIK":"調景嶺 Tiu Keng Leng","YAT":"油塘 Yau Tong","QUB":"鰂魚涌 Quarry Bay","NOP":"北角 North Point"} },
            "TCL": { name: "東涌綫 Tung Chung Line", stations: {"TUC":"東涌 Tung Chung","SUN":"欣澳 Sunny Bay","TSY":"青衣 Tsing Yi","LAK":"荔景 Lai King","NAC":"南昌 Nam Cheong","OLY":"奧運 Olympic","KOW":"九龍 Kowloon","HOK":"香港 Hong Kong"} },
            "SIL": { name: "南港島綫 South Island Line", stations: {"SOH":"海怡半島 South Horizons","LET":"利東 Lei Tung","WCH":"黃竹坑 Wong Chuk Hang","OCP":"海洋公園 Ocean Park","ADM":"金鐘 Admiralty"} },
            "DRL": { name: "迪士尼綫 Disneyland Resort Line", stations: {"SUN":"欣澳 Sunny Bay","DIS":"迪士尼 Disneyland Resort"} },
            "AEL": { name: "機場快綫 Airport Express", stations: {"HOK":"香港 Hong Kong","KOW":"九龍 Kowloon","TSY":"青衣 Tsing Yi","AIR":"機場 Airport","AWE":"博覽館 AsiaWorld-Expo"} },
            "EAL": { name: "東鐵綫 East Rail Line", stations: {"LOW":"羅湖 Lo Wu","LMC":"落馬洲 Lok Ma Chau","SHS":"上水 Sheung Shui","FAN":"粉嶺 Fanling","TWO":"太和 Tai Wo","TAP":"大埔墟 Tai Po Market","UNI":"大學 University","RAC":"馬場 Racecourse","FOT":"火炭 Fo Tan","SHT":"沙田 Sha Tin","TAW":"大圍 Tai Wai","KOT":"九龍塘 Kowloon Tong","MKK":"旺角東 Mong Kok East","HUH":"紅磡 Hung Hom","EXC":"會展 Exhibition Centre","ADM":"金鐘 Admiralty"} },
            "TML": { name: "屯馬綫 Tuen Ma Line", stations: {"TUM":"屯門 Tuen Mun","SIH":"兆康 Siu Hong","TIS":"天水圍 Tin Shui Wai","LOP":"朗屏 Long Ping","YUL":"元朗 Yuen Long","KSR":"錦上路 Kam Sheung Road","TWW":"荃灣西 Tsuen Wan West","MEF":"美孚 Mei Foo","NAC":"南昌 Nam Cheong","AUS":"柯士甸 Austin","ETS":"尖東 East Tsim Sha Tsui","HUH":"紅磡 Hung Hom","HOM":"何文田 Ho Man Tin","TKW":"土瓜灣 To Kwa Wan","SUW":"宋皇臺 Sung Wong Toi","CKA":"啟德 Kai Tak","DIH":"鑽石山 Diamond Hill","HIK":"顯徑 Hin Keng","TAW":"大圍 Tai Wai","CKT":"車公廟 Che Kung Temple","STW":"沙田圍 Sha Tin Wai","CIO":"第一城 City One","SHM":"石門 Shek Mun","TSH":"大水坑 Tai Shui Hang","HEO":"恆安 Heng On","MOS":"馬鞍山 Ma On Shan","WKS":"烏溪沙 Wu Kai Sha"} }
        };

        const DEST_NAMES = {
            "NOP":"北角 North Point","WHA":"黃埔 Whampoa","HOM":"何文田 Ho Man Tin","YMT":"油麻地 Yau Ma Tei","MOK":"旺角 Mong Kok","PRE":"太子 Prince Edward","SKM":"石硤尾 Shek Kip Mei","KOT":"九龍塘 Kowloon Tong","LOF":"樂富 Lok Fu","WTS":"黃大仙 Wong Tai Sin","DIH":"鑽石山 Diamond Hill","CHH":"彩虹 Choi Hung","KOB":"九龍灣 Kowloon Bay","NTK":"牛頭角 Ngau Tau Kok","KWT":"觀塘 Kwun Tong","LAT":"藍田 Lam Tin","YAT":"油塘 Yau Tong","TIK":"調景嶺 Tiu Keng Leng",
            "KET":"堅尼地城 Kennedy Town","HKU":"香港大學 HKU","SYP":"西營盤 Sai Ying Pun","SHW":"上環 Sheung Wan","CEN":"中環 Central","ADM":"金鐘 Admiralty","WAC":"灣仔 Wan Chai","CWB":"銅鑼灣 Causeway Bay","TIH":"天后 Tin Hau","FOH":"炮台山 Fortress Hill","QUB":"鰂魚涌 Quarry Bay","TAK":"太古 Tai Koo","SWH":"西灣河 Sai Wan Ho","SKW":"筲箕灣 Shau Kei Wan","CHW":"柴灣 Chai Wan","HFC":"杏花邨 Heng Fa Chuen",
            "JOR":"佐敦 Jordan","SSP":"深水埗 Sham Shui Po","CSW":"長沙灣 Cheung Sha Wan","LCK":"荔枝角 Lai Chi Kok","MEF":"美孚 Mei Foo","LAK":"荔景 Lai King","KWF":"葵芳 Kwai Fong","KWH":"葵興 Kwai Hing","TSW":"荃灣 Tsuen Wan","TWH":"大窩口 Tai Wo Hau","TKO":"將軍澳 Tseung Kwan O","LHP":"康城 LOHAS Park","HAH":"坑口 Hang Hau","POA":"寶琳 Po Lam",
            "TUM":"屯門 Tuen Mun","SIH":"兆康 Siu Hong","TIS":"天水圍 Tin Shui Wai","LOP":"朗屏 Long Ping","YUL":"元朗 Yuen Long","KSR":"錦上路 Kam Sheung Road","TWW":"荃灣西 Tsuen Wan West","NAC":"南昌 Nam Cheong","OLY":"奧運 Olympic","AUS":"柯士甸 Austin","ETS":"尖東 East Tsim Sha Tsui","HUH":"紅磡 Hung Hom","TKW":"土瓜灣 To Kwa Wan","SUW":"宋皇臺 Sung Wong Toi","CKA":"啟德 Kai Tak","HIK":"顯徑 Hin Keng","TAW":"大圍 Tai Wai","CKT":"車公廟 Che Kung Temple","STW":"沙田圍 Sha Tin Wai","CIO":"第一城 City One","SHM":"石門 Shek Mun","TSH":"大水坑 Tai Shui Hang","HEO":"恆安 Heng On","MOS":"馬鞍山 Ma On Shan","WKS":"烏溪沙 Wu Kai Sha",
            "EXC":"會展 Exhibition Centre","MKK":"旺角東 Mong Kok East","SHT":"沙田 Sha Tin","FOT":"火炭 Fo Tan","RAC":"馬場 Racecourse","UNI":"大學 University","TAP":"大埔墟 Tai Po Market","TWO":"太和 Tai Wo","FAN":"粉嶺 Fanling","SHS":"上水 Sheung Shui","LOW":"羅湖 Lo Wu","LMC":"落馬洲 Lok Ma Chau","HOK":"香港 Hong Kong","KOW":"九龍 Kowloon","TSY":"青衣 Tsing Yi","SUN":"欣澳 Sunny Bay","TUC":"東涌 Tung Chung","AIR":"機場 Airport","AWE":"博覽館 AsiaWorld-Expo","DIS":"迪士尼 Disneyland Resort",
            "OCP":"海洋公園 Ocean Park","WCH":"黃竹坑 Wong Chuk Hang","LET":"利東 Lei Tung","SOH":"海怡半島 South Horizons"
        };

        let trains = [];
        let timer1 = null, timer2 = null;
        const SIMULATE = false;

        let lastStatus = {
            hasSoon: false,
            lineName: ''
        };

        function initMenu() {
            const sel = document.getElementById("line-select");
            sel.innerHTML = '<option value="">--請選擇路綫--</option>';
            for (let code in LINES) {
                sel.innerHTML += `<option value="${code}">${LINES[code].name}</option>`;
            }
        }

        function onLineChange() {
            const lineCode = document.getElementById("line-select").value;
            const staSel = document.getElementById("station-select");
            const panel = document.getElementById("panel-content");
            const title = document.getElementById("panel-title");
            stopTimers();
            if (!lineCode) {
                staSel.innerHTML = '<option value="">--請選擇車站--</option>';
                panel.innerHTML = '<div class="loading-text">請在上方選單選擇路綫...</div>';
                title.innerText = "PIDS 看板待機中";
                return;
            }
            const stations = LINES[lineCode].stations;
            staSel.innerHTML = '<option value="">--請選擇車站--</option>';
            for (let code in stations) {
                staSel.innerHTML += `<option value="${code}">${stations[code]}</option>`;
            }
            panel.innerHTML = '<div class="loading-text">請選擇車站...</div>';
        }

        function onStationChange() {
            const station = document.getElementById("station-select").value;
            if (!station) return;
            startMonitor();
        }

        function stopTimers() {
            if (timer1) { clearInterval(timer1); timer1 = null; }
            if (timer2) { clearInterval(timer2); timer2 = null; }
        }

        // ===== 查詢該路綫所有車站 =====
        async function fetchAllStationsData() {
            const L = document.getElementById("line-select").value;
            if (!L) return null;

            // 模擬模式：全部超過 15 分鐘
            if (SIMULATE) {
                const allStations = LINES[L]?.stations || {};
                const codes = Object.keys(allStations);
                const now = new Date();
                let allTrains = [];
                let hasSoon = false;

                for (let i = 0; i < codes.length; i++) {
                    const code = codes[i];
                    // 每個車站生成 1-2 班列車，時間設為 100-190 分鐘後（超過 15 分鐘）
                    const numTrains = 1 + Math.floor(Math.random() * 2);
                    for (let j = 0; j < numTrains; j++) {
                        const destCode = codes[(i + j + 1) % codes.length] || codes[0];
                        const destName = DEST_NAMES[destCode] || destCode;
                        // 全部設為 100-190 分鐘後
                        const minutes = 100 + Math.floor(Math.random() * 90);
                        const t = new Date(now.getTime() + minutes * 60000);
                        allTrains.push({
                            dest: destName,
                            plat: (j % 3) + 1,
                            time: t,
                            station: code
                        });
                        const diff = (t - now) / 1000;
                        if (diff >= -90 && diff <= 900) {
                            hasSoon = true;
                        }
                    }
                }

                const currentStation = document.getElementById("station-select").value;
                trains = allTrains.filter(t => t.station === currentStation);

                return { hasSoon, allTrains };
            }

            // 真實模式
            const allStations = LINES[L]?.stations || {};
            const stationCodes = Object.keys(allStations);
            let allTrains = [];
            let hasSoon = false;

            for (let code of stationCodes) {
                try {
                    const url = "https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=" + L + "&sta=" + code;
                    const res = await fetch(url);
                    const json = await res.json();

                    if (json && json.status === 1 && json.data) {
                        let data = null;
                        const key = (L + "-" + code).toUpperCase();
                        if (json.data[key]) {
                            data = json.data[key];
                        } else {
                            const keys = Object.keys(json.data);
                            for (let k of keys) {
                                if (k && k.toUpperCase().includes(code.toUpperCase())) {
                                    data = json.data[k];
                                    break;
                                }
                            }
                            if (!data && keys.length > 0) data = json.data[keys[0]];
                        }

                        if (data) {
                            for (let dir of ['UP', 'DOWN']) {
                                if (data[dir] && Array.isArray(data[dir])) {
                                    for (let t of data[dir]) {
                                        const destCode = String(t.dest).toUpperCase().trim();
                                        const destName = DEST_NAMES[destCode] || destCode;
                                        const timeStr = t.time.replace(" ", "T") + "+08:00";
                                        const trainTime = new Date(timeStr);
                                        allTrains.push({
                                            dest: destName,
                                            plat: parseInt(t.plat) || 0,
                                            time: trainTime,
                                            station: code
                                        });
                                        const diff = (trainTime - new Date()) / 1000;
                                        if (diff >= -90 && diff <= 900) {
                                            hasSoon = true;
                                        }
                                    }
                                }
                            }
                        }
                    }
                } catch (e) {
                    console.log("獲取車站數據失敗:", code, e);
                }
            }

            const currentStation = document.getElementById("station-select").value;
            trains = allTrains.filter(t => t.station === currentStation);

            return { hasSoon, allTrains };
        }

        async function fetchData() {
            const L = document.getElementById("line-select").value;
            const S = document.getElementById("station-select").value;
            if (!L || !S) return;

            const result = await fetchAllStationsData();
            if (result) {
                updateStatusBar(true, result.hasSoon);
            }
        }

        function updateStatusBar(force = false, hasSoon = null) {
            const wrapper = document.getElementById("status-bar-wrapper");
            const bar = document.getElementById("status-bar");
            const now = new Date();

            if (hasSoon === null) {
                hasSoon = false;
                for (let t of trains) {
                    const diff = (t.time - now) / 1000;
                    if (diff >= -90 && diff <= 900) {
                        hasSoon = true;
                        break;
                    }
                }
            }

            const lineSel = document.getElementById("line-select");
            const lineName = lineSel.options[lineSel.selectedIndex]?.text || "本線路";

            const statusChanged = force || lastStatus.hasSoon !== hasSoon || lastStatus.lineName !== lineName;

            if (!statusChanged) {
                return;
            }

            lastStatus.hasSoon = hasSoon;
            lastStatus.lineName = lineName;

            bar.classList.remove('scroll-active');
            bar.style.width = '100%';
            bar.style.transform = 'none';
            bar.style.marginLeft = '0';

            // ===== 核心邏輯 =====
            if (hasSoon) {
                wrapper.style.background = "#000000";
                wrapper.style.border = "2px solid #4cd964";
                wrapper.style.boxShadow = "inset 0 0 8px rgba(76,217,100,0.3), 0 0 10px rgba(76,217,100,0.2)";
                bar.style.color = "#4cd964";
                bar.style.textShadow = "0 0 6px #4cd964";
                bar.innerText = "✅ 全線車務運作正常";
            } else {
                wrapper.style.background = "#ff9500";
                wrapper.style.border = "2px solid #ff9500";
                wrapper.style.boxShadow = "inset 0 0 10px rgba(255,149,0,0.5), 0 0 15px rgba(255,149,0,0.3)";
                bar.style.color = "#000000";
                bar.style.textShadow = "0 0 8px #ff9500, 0 0 12px #ff6a00";
                bar.innerText = `⚠️ ${lineName} 暫無班次 / 非營運時間`;
                void bar.offsetWidth;
                bar.style.width = 'auto';
                bar.style.marginLeft = '100%';
                bar.classList.add('scroll-active');
            }
        }

        function render() {
            const staSel = document.getElementById("station-select");
            if (!staSel || staSel.selectedIndex === -1 || !staSel.value) return;

            const stationName = staSel.options[staSel.selectedIndex].text;
            document.getElementById("panel-title").innerText = `📊 ${stationName} 站 · 實時月台 PIDS 顯示屏`;

            const now = new Date();
            let html = "";

            trains.sort((a, b) => {
                if (a.plat !== b.plat) return a.plat - b.plat;
                return a.time - b.time;
            });

            for (let t of trains) {
                const diff = Math.floor((t.time - now) / 1000);
                if (diff >= -90) {
                    let timeText = "", cls = "";
                    if (diff < 0) {
                        timeText = "列車到站中 ARRIVING";
                        cls = "arriving";
                    } else {
                        const m = Math.floor(diff / 60);
                        const s = String(diff % 60).padStart(2, '0');
                        timeText = `${m}分 ${s}秒`;
                    }
                    html += `
                        <div class="train-card">
                            <div>
                                <div class="train-dest">往 ${t.dest}</div>
                                <div class="train-plat">${t.plat} 號月台 Platform ${t.plat}</div>
                            </div>
                            <div class="train-time ${cls}">${timeText}</div>
                        </div>
                    `;
                }
            }

            document.getElementById("panel-content").innerHTML = html || `
                <div class="loading-text" style="color:#ff9500; text-shadow:0 0 8px #ff9500; font-weight:bold;">
                    非營運時間或暫無班次 TERMINATED
                </div>
            `;

            updateStatusBar(false);
        }

        function startMonitor() {
            stopTimers();
            document.getElementById("panel-content").innerHTML = '<div class="loading-text">正在讀取港鐵月台數據...</div>';
            fetchData().then(() => {
                render();
                timer1 = setInterval(render, 1000);
            });
            timer2 = setInterval(fetchData, 60000);
        }

        initMenu();
    </script>
</body>
</html>
