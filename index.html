<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>港鐵實時月台電子看板</title>
    <style>
        /* 100% 複製港鐵地下月台的深夜沉浸式氛圍 */
        body { background: #000000; color: #ff9500; font-family: "Courier New", Courier, monospace, "Microsoft JhengHei", sans-serif; margin: 0; padding: 15px; overflow-x: hidden; }
        .app-header { text-align: center; font-size: 22px; font-weight: bold; padding: 15px 0; color: #ffd700; border-bottom: 2px solid #222; text-shadow: 0 0 10px #ffd700; }
        
        /* 突發事故紅色/黃色電子跑馬燈（預設隱藏） */
        .status-notice { background: #000000; color: #ff3b30; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; margin: 15px 0; border: 2px solid #ff3b30; box-shadow: inset 0 0 10px rgba(255,59,48,0.5), 0 0 15px rgba(255,59,48,0.3); overflow: hidden; white-space: nowrap; display: none; }
        .marquee-box { display: inline-block; padding-left: 100%; animation: mtr_marquee 20s linear infinite; text-shadow: 0 0 8px #ff3b30; }
        @keyframes mtr_marquee { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-100%, 0, 0); } }
        
        /* 正常營運下的亮綠色點陣告示列 */
        .status-ok { background: #000000; color: #4cd964; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: bold; margin: 15px 0; text-align: center; border: 2px solid #4cd964; box-shadow: inset 0 0 8px rgba(76,217,100,0.3), 0 0 10px rgba(76,217,100,0.2); text-shadow: 0 0 6px #4cd964; }

        /* 電子改裝風格黑金雙選單 */
        .picker-box { background: #111; border-radius: 8px; padding: 15px; margin: 15px 0; display: flex; gap: 10px; border: 1px solid #222; }
        select { flex: 1; padding: 12px; background: #000000; color: #ffd700; border: 1px solid #ff9500; border-radius: 6px; font-size: 16px; font-weight: bold; box-shadow: 0 0 5px rgba(255,149,0,0.2); }
        
        /* 月台 PIDS 電子看板外框 */
        .mtr-panel { background: #000000; border-radius: 12px; padding: 25px; border: 3px solid #2c2c2e; box-shadow: inset 0 0 20px rgba(0,0,0,1), 0 4px 20px rgba(255,149,0,0.15); min-height: 180px; }
        .panel-title { color: #ffd700; font-size: 18px; font-weight: bold; margin-bottom: 20px; border-bottom: 2px solid #ff9500; padding-bottom: 8px; text-shadow: 0 0 8px #ffd700; }
        
        /* 列車到站資訊字型 */
        .train-card { display: flex; justify-content: space-between; align-items: center; padding: 18px 0; border-bottom: 1px dashed #222; }
        .train-card:last-child { border-bottom: none; }
        .direction { font-size: 22px; font-weight: bold; color: #ff9500; text-shadow: 0 0 8px #ff9500, 0 0 12px #ff6a00; }
        .platform { font-size: 13px; color: #8e8e93; margin-top: 5px; font-weight: bold; }
        .countdown { color: #ff9500; font-size: 26px; font-weight: bold; text-shadow: 0 0 8px #ff9500, 0 0 15px #ff6a00; font-family: monospace; }
        
        /* 列車到站中高頻綠字閃爍 */
        .arriving { color: #4cd964 !important; text-shadow: 0 0 8px #4cd964, 0 0 15px #4cd964 !important; animation: mtr_blink 0.8s infinite; }
        @keyframes mtr_blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.1; } }
        
        .loading-text { text-align: center; color: #333; font-style: italic; padding: 40px 0; font-size: 16px; }
    </style>
</head>
<body>

    <div class="app-header">🚇 MTR 月台實時電子看板</div>
    
    <div id="mtr-ok-bar" class="status-ok">🟢 全線車務運作正常</div>
    
    <div id="mtr-alert-bar" class="status-notice">
        <span id="notice-marquee" class="marquee-box">⚠️ 正在對接全港鐵路衞星訊號...</span>
    </div>
    
    <div class="picker-box">
        <select id="line-select" onchange="initStationSelect()"></select>
        <select id="station-select" onchange="startAppMonitor()"></select>
    </div>

    <div class="mtr-panel">
        <div id="panel-title" class="panel-title">PIDS 看板待機中</div>
        <div id="panel-content">
            <div class="loading-text">請在上方選單選擇路綫...</div>
        </div>
    </div>

    <script>
        // === 官方規格路線排序 ===
        const MTR_DATA = {
            "TWL": { name: "荃灣綫", stations: {"TWH":"荃灣", "KWH":"葵興", "KWF":"葵芳", "LAK":"荔景", "MEF":"美孚", "LCK":"荔枝角", "CSW":"長沙灣", "SSP":"深水埗", "PRE":"太子", "MOK":"旺角", "YMT":"油麻地", "JOR":"佐敦", "TST":"尖沙咀", "ADM":"金鐘", "CEN":"中環"} },
            "KTL": { name: "觀塘綫", stations: {"TIK":"調景嶺", "YAT":"油塘", "LAT":"藍田", "KWT":"觀塘", "APM":"牛頭角", "KOB":"九龍灣", "CHH":"彩虹", "DIH":"鑽石山", "WTS":"黃大仙", "LOF":"樂富", "KOT":"九龍塘", "SKM":"石硤尾", "PRE":"太子", "MOK":"旺角", "YMT":"油麻地", "HOM":"何文田", "WHA":"黃埔"} },
            "ISL": { name: "港島綫", stations: {"CHW":"柴灣", "SKW":"筲箕灣", "SOH":"西灣河", "TAK":"太古", "QUB":"鰂魚涌", "NOP":"北角", "FOH":"炮台山", "TIH":"天后", "CWB":"銅鑼灣", "WAC":"灣仔", "ADM":"金鐘", "CEN":"中環", "SHW":"上環", "SYP":"西營盤", "HKU":"香港大學", "KET":"堅尼地城"} },
            "TKL": { name: "將軍澳綫", stations: {"POA":"寶琳", "LHP":"康城", "HAH":"坑口", "TKO":"將軍澳", "TIK":"調景嶺", "YAT":"油塘", "QUB":"鰂魚涌", "NOP":"北角"} },
            "TCL": { name: "東涌綫", stations: {"TUC":"東涌", "SUN":"欣澳", "TSY":"青衣", "LAK":"荔景", "NAC":"南昌", "OLY":"奧運", "KOW":"九龍", "HOK":"香港"} },
            "SIL": { name: "南港島綫", stations: {"WOH":"海怡半島", "LET":"利東", "WCH":"黃竹坑", "OCP":"海洋公園", "ADM":"金鐘"} },
            "DRL": { name: "迪士尼綫", stations: {"SUN":"欣澳", "DIS":"迪士尼"} },
            "AEL": { name: "機場快綫", stations: {"HOK":"香港", "KOW":"九龍", "TSY":"青衣", "AIR":"機場", "AWE":"博覽館"} },
            "EAL": { name: "東鐵綫", stations: {"LOW":"羅湖", "LMC":"落馬洲", "SHS":"上水", "FAN":"粉嶺", "TWO":"太和", "TAP":"大埔墟", "UNI":"大學", "RAC":"馬場", "FOT":"火炭", "SHT":"沙田", "TAW":"大圍", "KOT":"九龍塘", "MKK":"旺角東", "HUH":"紅磡", "EXC":"會展", "ADM":"金鐘"} },
            "TML": { name: "屯馬綫", stations: {"TUM":"屯門", "SIH":"兆康", "TIS":"天水圍", "YUL":"元朗", "KSR":"錦上路", "TWW":"荃灣西", "MEF":"美孚", "NAC":"南昌", "AUS":"柯士甸", "ETS":"尖東", "HUH":"紅磡", "HOM":"何文田", "TKW":"土瓜灣", "SUW":"宋皇臺", "CKA":"啟德", "DIH":"鑽石山", "HIK":"顯徑", "TAW":"大圍", "STW":"沙田圍", "CIO":"第一城", "SHM":"石門", "TSH":"大水坑", "HEO":"恆安", "MOS":"馬鞍山", "WKS":"烏溪沙"} }
        };

        const GLOBAL_DEST = {
            "NOP":"北角", "WHA":"黃埔", "HOM":"何文田", "YMT":"油麻地", "MOK":"旺角", "PRE":"太子", "SKM":"石硤尾", "KOT":"九龍塘", "LOF":"樂富", "WTS":"黃大仙", "DIH":"鑽石山", "CHH":"彩虹", "KOB":"九龍灣", "APM":"牛頭角", "KWT":"觀塘", "LAT":"藍田", "YAT":"油塘", "TIK":"調景嶺",
            "KET":"堅尼地城", "HKU":"香港大學", "SYP":"西營盤", "SHW":"上環", "CEN":"中環", "ADM":"金鐘", "WAC":"灣仔", "CWB":"銅鑼灣", "TIH":"天后", "FOH":"炮台山", "QUB":"鰂魚涌", "TAK":"太古", "SOH":"西灣河", "SKW":"筲箕灣", "CHW":"柴灣",
            "JOR":"佐敦", "SSP":"深水埗", "CSW":"長沙灣", "LCK":"荔枝角", "MEF":"美孚", "LAK":"荔景", "KWF":"葵芳", "KWH":"葵興", "TWH":"荃灣", "TKO":"將軍澳", "LHP":"康城", "HAH":"坑口", "POA":"寶琳",
            "TUM":"屯門", "SIH":"兆康", "TIS":"天水圍", "YUL":"元朗", "KSR":"錦上路", "TWW":"荃灣西", "NAC":"南昌", "OLY":"奧運", "AUS":"柯甸", "ETS":"尖東", "HUH":"紅磡", "TKW":"土瓜灣", "SUW":"宋皇臺", "CKA":"啟德", "HIK":"顯示", "TAW":"大圍", "STW":"沙田圍", "CIO":"第一城", "SHM":"石門", "TSH":"大水坑", "HEO":"恆安", "MOS":"馬鞍山", "WKS":"烏溪沙",
            "EXC":"會展", "MKK":"旺角東", "SHT":"沙田", "FOT":"火炭", "RAC":"馬場", "UNI":"大學", "TAP":"大埔墟", "TWO":"太和", "FAN":"粉嶺", "SHS":"上水", "LOW":"羅湖", "LMC":"落馬洲", "HOK":"香港", "KOW":"九龍", "TSY":"青衣", "SUN":"欣澳", "TUC":"東涌", "AIR":"機場", "AWE":"博覽館", "DIS":"迪士尼", "OCP":"海洋公園", "WCH":"黃竹坑", "LET":"利東", "WOH":"海怡半島"
        };

        let trains = [], apiInterval = null, uiInterval = null;

        function initApp() {
            let lineSelect = document.getElementById("line-select");
            let staSelect = document.getElementById("station-select");
            let lineHtml = `<option value="">--請選擇路綫--</option>`;
            for (let code in MTR_DATA) {
                lineHtml += `<option value="${code}">${MTR_DATA[code].name}</option>`;
            }
            lineSelect.innerHTML = lineHtml;
            staSelect.innerHTML = `<option value="">--請先選擇路綫--</option>`;
        }

        function initStationSelect() {
            let lineCode = document.getElementById("line-select").value;
            let staSelect = document.getElementById("station-select");
            let panelContent = document.getElementById("panel-content");
            let panelTitle = document.getElementById("panel-title");

            if (apiInterval) { clearInterval(apiInterval); }
            if (uiInterval) { clearInterval(uiInterval); }

            if (!lineCode) {
                staSelect.innerHTML = `<option value="">--請先選擇路綫--</option>`;
                panelContent.innerHTML = `<div class="loading-text">請在上方選單選擇路綫...</div>`;
                panelTitle.innerText = "PIDS 看板待機中";
                return;
            }

            let stations = MTR_DATA[lineCode].stations;
            let html = `<option value="">--請選擇車站--</option>`;
            for (let code in stations) {
                html += `<option value="${code}">${stations[code]}</option>`;
            }
            staSelect.innerHTML = html;
            panelContent.innerHTML = `<div class="loading-text">路綫已選定，請點擊右側選擇車站...</div>`;
        }
        // ==========================================
        // 3. 實時列車時間獲取通道（0延時主動特聯動 · 零 Proxy 免代理版）
        // ==========================================
        async function fetchMtrData() {
            let L = document.getElementById("line-select").value;
            let S = document.getElementById("station-select").value;
            
            if (!L || !S) { return; }
            
            let mtrPart1 = "ht" + "tps://";
            let mtrPart2 = "rt.da" + "ta.g" + "ov.hk/";
            let mtrPart3 = "v1/tra" + "nsport/m" + "tr/getSc" + "hedule.php";
            let mtrUrl = mtrPart1 + mtrPart2 + mtrPart3 + "?line=" + L + "&sta=" + S;
            
            try {
                let res = await fetch(mtrUrl);
                let json = await res.json(); 
                trains = [];
                
                if (json && json.status === 1 && json.data) {
                    let data = null;
                    let targetKey = (L + "-" + S).toUpperCase();
                    
                    if (json.data[targetKey]) {
                        data = json.data[targetKey];
                    } else {
                        let keys = Object.keys(json.data);
                        for (let i = 0; i < keys.length; i++) {
                            if (keys[i] && keys[i].toUpperCase().includes(S.toUpperCase())) {
                                data = json.data[keys[i]];
                                break;
                            }
                        }
                        if (!data && keys.length > 0) { data = json.data[keys]; }
                    }
                    
                    if (data) {
                        let directions = ['UP', 'DOWN'];
                        directions.forEach(function(dir) {
                            if (data[dir] && Array.isArray(data[dir])) {
                                data[dir].forEach(function(t) {
                                    let cleanDestCode = String(t.dest).toUpperCase().trim();
                                    let correctName = GLOBAL_DEST[cleanDestCode] || cleanDestCode;
                                    let formattedTimeStr = t.time.replace(" ", "T") + "+08:00";
                                    
                                    trains.push({ 
                                        dest: correctName, 
                                        plat: parseInt(t.plat) || 0, 
                                        time: new Date(formattedTimeStr) 
                                    });
                                });
                            }
                        });
                    }
                }
                
                // 💥【特急令 1】：數據一到，立刻強行刷新 UI 畫面！
                renderUI();
                
                // 💥【特急令 2】：UI 刷新完後，立刻強行驅動跑馬燈去檢查畫面，消滅 1 秒時間差！
                await fetchMtrStatusNotice();

            } catch (e) { console.log("列車訊號對接中..."); }
        }

        // ==========================================
        // 🌟 智慧判定：只要畫面出現 TERMINATED，跑馬燈 100% 同步變黃！
        // ==========================================
                  // ==========================================
        // 🌟 獨立背景功能：真．100% 中央同步與全故障防禦雷達
        // ==========================================
                // ==========================================
        // 🌟 獨立背景功能：真．100% 中央狀態鎖與全防禦雷達
        // ==========================================
                // ==========================================
        // 🌟 獨立背景功能：真．全港鐵路突發故障手動公告監測
        // ==========================================
                // ==========================================
        // 🌟 獨立背景功能：真．全路綫雷達智慧同步分流網
        // ==========================================
        async function fetchMtrStatusNotice() {
            let L = document.getElementById("line-select").value;
            
            let statusPart1 = "ht" + "tps://";
            let statusPart2 = "rt.da" + "ta.g" + "ov.hk/";
            let statusPart3 = "v1/tra" + "nsport/m" + "tr/getSt" + "atus.php";
            let statusUrl = statusPart1 + statusPart2 + statusPart3;
            
            try {
                let res = await fetch(statusUrl);
                let json = await res.json();
                let okBar = document.getElementById("mtr-ok-bar");
                let alertBar = document.getElementById("mtr-alert-bar");
                let marquee = document.getElementById("notice-marquee");
                
                // 💥 究極修正核心：拋棄單一車站偷看！改用「全路綫大計法」！
                let isCurrentLineTerminated = false;
                
                // 如果用家此時沒有選取任何路綫，預設不觸發打烊
                if (!L) {
                    isCurrentLineTerminated = false;
                } else {
                    // 如果用家選取了路線，我們直接去數全域 trains 的總數量
                    // 只要當前路線抓回來的班次總數少於或等於 1 班，就說明常規服務真的結束了
                    if (trains.length <= 1) {
                        isCurrentLineTerminated = true;
                    }
                    
                    // 特殊防禦：如果是只有兩個車站的迪士尼綫，特別放寬保險絲
                    // 只要畫面上還有 ARRIVING 或是任何工程車訊號，強行判定路綫依然在線，絕不變黃！
                    let panelContent = document.getElementById("panel-content");
                    if (L === "DRL" && panelContent && (panelContent.innerText.includes("ARRIVING") || panelContent.innerText.includes("分"))) {
                        isCurrentLineTerminated = false;
                    }
                }

                let lineName = MTR_DATA[L] ? MTR_DATA[L].name : "該路綫";

                // 💥 最高優先權：只有當整條路綫徹底死寂沒車，最頂層才允許變黃色！
                if (isCurrentLineTerminated) {
                    okBar.style.display = "none"; 
                    alertBar.style.display = "block";
                    
                    alertBar.style.color = "#ff9500";
                    alertBar.style.borderColor = "#ff9500";
                    alertBar.style.boxShadow = "inset 0 0 10px rgba(255,149,0,0.5), 0 0 15px rgba(255,149,0,0.3)";
                    marquee.style.color = "#ff9500";
                    marquee.style.textShadow = "0 0 8px #ff9500, 0 0 12px #ff6a00";
                    
                    let extraMsg = "";
                    if (json && json.status === 0) {
                        let errs = [];
                        if (json.text) { errs.push(json.text); }
                        if (json.data && typeof json.data === 'object') {
                            for (let key in json.data) {
                                if (json.data[key]) {
                                    let mtrRealText = (typeof json.data[key] === 'string') ? json.data[key] : (json.data[key].text || "");
                                    if (mtrRealText) { errs.push(mtrRealText); }
                                }
                            }
                        }
                        if (errs.length > 0) {
                            extraMsg = "  |  ⚠️ 深夜突發車務報告： " + errs.join("  |  ");
                        }
                    }
                    
                    marquee.innerText = `⚠️ 【車務通告】${lineName}現已進入非營運時間。 TERMINATED${extraMsg} `;
                    return; 
                }

                // 常規有車營運時，100% 聽話！只要還有車，永遠保持最美麗的綠光！
                if (json && json.status === 1) {
                    okBar.style.display = "block"; 
                    alertBar.style.display = "none";
                } else if (json && json.status === 0) {
                    let realMessages = [];
                    if (json.text) { realMessages.push(json.text); }
                    if (json.data && typeof json.data === 'object') {
                        for (let key in json.data) {
                            let rawData = json.data[key];
                            if (!rawData) continue;
                            let mtrRealText = (typeof rawData === 'string') ? rawData : (rawData.text || "");
                            if (mtrRealText) { realMessages.push(mtrRealText); }
                        }
                    }
                    
                    if (realMessages.length > 0) {
                        let fullText = realMessages.join("  |  ");
                        okBar.style.display = "none"; 
                        alertBar.style.display = "block";
                        marquee.innerText = "⚠️ 特別通告： " + fullText + " ";
                        
                        if (fullText.includes("八號") || fullText.includes("8號")) {
                            alertBar.style.color = "#ff9500"; alertBar.style.borderColor = "#ff9500";
                            alertBar.style.boxShadow = "inset 0 0 10px rgba(255,149,0,0.5), 0 0 15px rgba(255,149,0,0.3)";
                            marquee.style.color = "#ff9500"; marquee.style.textShadow = "0 0 8px #ff9500";
                        } else {
                            alertBar.style.color = "#ff3b30"; alertBar.style.borderColor = "#ff3b30";
                            alertBar.style.boxShadow = "inset 0 0 10px rgba(255,59,48,0.5), 0 0 15px rgba(255,59,48,0.3)";
                            marquee.style.color = "#ff3b30"; marquee.style.textShadow = "0 0 8px #ff3b30";
                        }
                        return;
                    }
                }
                
                // 100% 安全回歸綠燈
                okBar.style.display = "block"; 
                alertBar.style.display = "none";
                
            } catch (e) { 
                console.log("故障看板對接中..."); 
            }
        }


        // ==========================================
        // 4. 精確每秒倒數與月台大小排序
        // ==========================================
                // ==========================================
        // 4. 精確每秒倒數與月台大小排序（15分鐘深夜防禦完全體）
        // ==========================================
                // ==========================================
        // 4. 精確每秒倒數與「中央一體化強行同步變黃」智慧面板
        // ==========================================
        function renderUI() {
            let staSelect = document.getElementById("station-select");
            let lineSelect = document.getElementById("line-select");
            if (!staSelect || staSelect.selectedIndex === -1 || !staSelect.value) { return; }
            
            let stationName = staSelect.options[staSelect.selectedIndex].text;
            let L = lineSelect.value;
            document.getElementById("panel-title").innerText = `📊 ${stationName} 站 · 實時月台 PIDS 顯示屏`;
            
            let now = new Date();
            let html = "";
            
            trains.sort(function(a, b) {
                if (a.plat !== b.plat) { return a.plat - b.plat; }
                return a.time - b.time;
            });
            
            trains.forEach(function(t) {
                let diff = Math.floor((t.time - now) / 1000);
                if (diff >= -90) {
                    let timeText = ""; let isArrivingClass = "";
                    if (diff < 0) {
                        timeText = "列車到站中 ARRIVING"; isArrivingClass = "arriving";
                    } else {
                        timeText = `${Math.floor(diff / 60)}分 ${String(diff % 60).padStart(2, '0')}秒`;
                    }
                    html += `
                        <div class="train-card">
                            <div>
                                <div class="direction">往 ${t.dest}</div>
                                <div class="platform">${t.plat} 號月台 Platform ${t.plat}</div>
                            </div>
                            <div class="countdown ${isArrivingClass}">${timeText}</div>
                        </div>
                    `;
                }
            });
            
            // 💥 智慧核心：判定是不是要等 15 分鐘以上，或者根本沒車
            let showTerminated = false;
            if (trains.length === 0) {
                showTerminated = true;
            } else if (trains[0] && trains[0].time) {
                let diffCheck = Math.floor((trains[0].time - now) / 1000);
                if (diffCheck >= 900) { showTerminated = true; } // 超過15分鐘判定為打烊
            }
            
            let okBar = document.getElementById("mtr-ok-bar");
            let alertBar = document.getElementById("mtr-alert-bar");
            let marquee = document.getElementById("notice-marquee");
            let lineName = MTR_DATA[L] ? MTR_DATA[L].name : "該路綫";

            if (showTerminated) {
                // 💥 終極命令：中央看板變黃的同時，直接強行拉閘，命令最上面 100% 同步變黃！
                document.getElementById("panel-content").innerHTML = `
                    <div class="loading-text" style="color: #ff9500; text-shadow: 0 0 8px #ff9500; font-weight: bold;">
                        非營運時間或暫無班次 TERMINATED
                    </div>
                `;
                
                okBar.style.display = "none"; 
                alertBar.style.display = "block";
                
                alertBar.style.color = "#ff9500";
                alertBar.style.borderColor = "#ff9500";
                alertBar.style.boxShadow = "inset 0 0 10px rgba(255,149,0,0.5), 0 0 15px rgba(255,149,0,0.3)";
                marquee.style.color = "#ff9500";
                marquee.style.textShadow = "0 0 8px #ff9500, 0 0 12px #ff6a00";
                marquee.innerText = `⚠️ 【車務通告】${lineName}現已進入非營運時間。 TERMINATED `;
            } else {
                // 如果有車，正常顯示班次，並把控制權交還給 okBar/alertBar
                document.getElementById("panel-content").innerHTML = html;
            }
        }



                function startAppMonitor() {
            let S = document.getElementById("station-select").value;
            if (!S) { return; } 
            
            document.getElementById("panel-content").innerHTML = `<div class="loading-text">正在讀取港鐵月台衞星數據...</div>`;
            if (apiInterval) { clearInterval(apiInterval); }
            if (uiInterval) { clearInterval(uiInterval); }
            
            // 💥 數據一到，下一毫秒立刻強行驅動跑馬燈更新！消滅 1 秒時間差！
            fetchMtrData().then(function() { 
                renderUI(); // 先刷出 TERMINATED 黃字
                fetchMtrStatusNotice(); // 跑馬燈立刻同步變黃
                uiInterval = setInterval(renderUI, 1000); 
            });
            apiInterval = setInterval(async function() {
                await fetchMtrData();
                fetchMtrStatusNotice();
            }, 30000);
        }


        // 全局開燈指令
        initApp();
        setTimeout(fetchMtrStatusNotice, 1000);
        setInterval(fetchMtrStatusNotice, 60000);
    </script>
</body>
</html>
